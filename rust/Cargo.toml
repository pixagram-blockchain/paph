[package]
name    = "paph-x"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "PAPH-X — PAPH 4.2's integer-only perceptual hash and calibrated comparator for pixel-art plagiarism detection (wire SPEC-003, comparator SPEC-004.2) with the retrieval-native cascade of SPEC-X"

[lib]
# the library keeps the crate name `paph`: `use paph::…` everywhere, and the
# WebAssembly artefact stays paph.wasm
name       = "paph"
crate-type = ["cdylib", "rlib"]

[features]
# the equivalence digest as a library function (native bin and a test-only
# WebAssembly export); never in a shipped binary
equiv = []

[[bin]]
name = "paph-equiv"
required-features = ["equiv"]

[dependencies]
# none, on purpose.  This is a consensus artefact: every dependency is another
# way for two nodes to disagree.

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
